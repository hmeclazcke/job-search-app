<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Compact Execution Flow - Job Search App</title>
  <desc id="desc">Compact sequence diagram for a job search request.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#111827"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 800 30px Arial, sans-serif; fill: #111827; }
    .subtitle { font: italic 18px Arial, sans-serif; fill: #374151; }
    .box { stroke-width: 1.8; rx: 8; }
    .web { fill: #eff6ff; stroke: #2563eb; }
    .service { fill: #fffbeb; stroke: #d97706; }
    .provider { fill: #f5f3ff; stroke: #7c3aed; }
    .api { fill: #f8fafc; stroke: #64748b; }
    .label { font: 800 14px Arial, sans-serif; fill: #111827; }
    .small { font: 400 12px Arial, sans-serif; fill: #111827; }
    .life { stroke: #111827; stroke-width: 1.3; stroke-dasharray: 6 7; }
    .call { stroke: #111827; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .return { stroke: #111827; stroke-width: 1.7; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    .active-blue { fill: #dbeafe; stroke: #2563eb; }
    .active-yellow { fill: #fef3c7; stroke: #d97706; }
    .active-purple { fill: #ede9fe; stroke: #7c3aed; }
    .note { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
  </style>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="45" text-anchor="middle">Execution Flow</text>
  <text class="subtitle" x="600" y="74" text-anchor="middle">Controller -> Service -> Providers -> Unified response</text>

  <rect class="box web" x="70" y="112" width="150" height="62"/>
  <text class="label" x="145" y="140" text-anchor="middle">Client</text>
  <text class="small" x="145" y="160" text-anchor="middle">HTTP</text>

  <rect class="box web" x="280" y="112" width="170" height="62"/>
  <text class="label" x="365" y="140" text-anchor="middle">Controller</text>
  <text class="small" x="365" y="160" text-anchor="middle">JobSearchController</text>

  <rect class="box service" x="510" y="112" width="170" height="62"/>
  <text class="label" x="595" y="140" text-anchor="middle">Service</text>
  <text class="small" x="595" y="160" text-anchor="middle">JobSearchService</text>

  <rect class="box provider" x="740" y="112" width="170" height="62"/>
  <text class="label" x="825" y="140" text-anchor="middle">Providers</text>
  <text class="small" x="825" y="160" text-anchor="middle">JobProvider list</text>

  <rect class="box api" x="970" y="112" width="160" height="62"/>
  <text class="label" x="1050" y="140" text-anchor="middle">External APIs</text>
  <text class="small" x="1050" y="160" text-anchor="middle">Jobicy / LinkedIn</text>

  <line class="life" x1="145" y1="174" x2="145" y2="660"/>
  <line class="life" x1="365" y1="174" x2="365" y2="660"/>
  <line class="life" x1="595" y1="174" x2="595" y2="660"/>
  <line class="life" x1="825" y1="174" x2="825" y2="660"/>
  <line class="life" x1="1050" y1="174" x2="1050" y2="660"/>

  <rect class="active-blue" x="358" y="230" width="14" height="335"/>
  <rect class="active-yellow" x="588" y="285" width="14" height="230"/>
  <rect class="active-purple" x="818" y="340" width="14" height="118"/>

  <path class="call" d="M145 245 L358 245"/>
  <text class="small" x="190" y="234">1. POST /jobs/search</text>

  <path class="call" d="M372 300 L588 300"/>
  <text class="small" x="430" y="289">2. search(criteria)</text>

  <path class="call" d="M602 355 L818 355"/>
  <text class="small" x="660" y="344">3. search all providers</text>

  <path class="call" d="M832 395 L1050 395"/>
  <text class="small" x="875" y="384">4. request jobs</text>

  <path class="return" d="M1050 435 L832 435"/>
  <text class="small" x="890" y="427">5. DTOs / HTML</text>

  <path class="return" d="M818 475 L602 475"/>
  <text class="small" x="660" y="467">6. List&lt;Job&gt;</text>

  <path class="return" d="M588 535 L372 535"/>
  <text class="small" x="430" y="527">7. unified jobs</text>

  <path class="return" d="M358 590 L145 590"/>
  <text class="small" x="190" y="582">8. 200 OK</text>

  <rect class="note" x="390" y="620" width="420" height="52"/>
  <text class="small" x="600" y="642" text-anchor="middle">Provider-specific DTOs never reach the domain.</text>
  <text class="small" x="600" y="660" text-anchor="middle">Everything becomes `Job` before returning.</text>
</svg>
