<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Execution Flow - Job Search App</title>
  <desc id="desc">Detailed sequence diagram showing cache lookup, cache hit return, cache miss delegation, provider calls, Redis write, and HTTP response.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#111827"/>
    </marker>
    <marker id="cache-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.13"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 800 34px Arial, sans-serif; fill: #111827; }
    .subtitle { font: italic 20px Arial, sans-serif; fill: #374151; }
    .box { stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .user { fill: #ecfdf5; stroke: #16a34a; }
    .web { fill: #eff6ff; stroke: #2563eb; }
    .decorator { fill: #fef3c7; stroke: #d97706; }
    .service { fill: #fff7ed; stroke: #ea580c; }
    .provider { fill: #f5f3ff; stroke: #7c3aed; }
    .cache { fill: #ccfbf1; stroke: #0f766e; }
    .api { fill: #f8fafc; stroke: #64748b; }
    .note { fill: #fefce8; stroke: #a16207; stroke-width: 1.5; stroke-dasharray: 5 5; rx: 10; }
    .hit { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 5 5; rx: 10; }
    .miss { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; stroke-dasharray: 5 5; rx: 10; }
    .label { font: 800 14px Arial, sans-serif; fill: #111827; }
    .small { font: 400 13px Arial, sans-serif; fill: #111827; }
    .tiny { font: 400 12px Arial, sans-serif; fill: #374151; }
    .life { stroke: #111827; stroke-width: 1.4; stroke-dasharray: 6 7; }
    .call { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .cache-call { stroke: #0f766e; stroke-width: 2.2; fill: none; marker-end: url(#cache-arrow); }
    .return { stroke: #111827; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    .cache-return { stroke: #0f766e; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#cache-arrow); }
    .activate-web { fill: #dbeafe; stroke: #2563eb; }
    .activate-decorator { fill: #fef3c7; stroke: #d97706; }
    .activate-service { fill: #ffedd5; stroke: #ea580c; }
    .activate-provider { fill: #ede9fe; stroke: #7c3aed; }
    .activate-cache { fill: #99f6e4; stroke: #0f766e; }
    .activate-api { fill: #e2e8f0; stroke: #64748b; }
    .legend { fill: #ffffff; stroke: #111827; stroke-width: 1.6; rx: 10; }
  </style>

  <rect class="bg" width="1600" height="1040"/>
  <text class="title" x="800" y="45" text-anchor="middle">Execution Flow - Job Search App</text>
  <text class="subtitle" x="800" y="76" text-anchor="middle">Redis cache decorator before provider aggregation</text>

  <rect class="box user" x="28" y="112" width="105" height="72"/>
  <text class="label" x="80" y="154" text-anchor="middle">User</text>

  <rect class="box web" x="170" y="112" width="150" height="72"/>
  <text class="label" x="245" y="144" text-anchor="middle">Controller</text>
  <text class="tiny" x="245" y="166" text-anchor="middle">JobSearchController</text>

  <rect class="box decorator" x="370" y="112" width="170" height="72"/>
  <text class="label" x="455" y="144" text-anchor="middle">Decorator</text>
  <text class="tiny" x="455" y="166" text-anchor="middle">CachedJobSearchService</text>

  <rect class="box cache" x="598" y="112" width="130" height="72"/>
  <text class="label" x="663" y="144" text-anchor="middle">Redis</text>
  <text class="tiny" x="663" y="166" text-anchor="middle">job-searches</text>

  <rect class="box service" x="785" y="112" width="160" height="72"/>
  <text class="label" x="865" y="144" text-anchor="middle">Real Service</text>
  <text class="tiny" x="865" y="166" text-anchor="middle">JobSearchService</text>

  <rect class="box provider" x="1000" y="112" width="135" height="72"/>
  <text class="label" x="1067" y="144" text-anchor="middle">Jobicy</text>
  <text class="tiny" x="1067" y="166" text-anchor="middle">Provider</text>

  <rect class="box provider" x="1178" y="112" width="135" height="72"/>
  <text class="label" x="1245" y="144" text-anchor="middle">LinkedIn</text>
  <text class="tiny" x="1245" y="166" text-anchor="middle">Provider</text>

  <rect class="box provider" x="1360" y="112" width="160" height="72"/>
  <text class="label" x="1440" y="144" text-anchor="middle">Internal Jobs</text>
  <text class="tiny" x="1440" y="166" text-anchor="middle">Mongo provider</text>

  <line class="life" x1="80" y1="184" x2="80" y2="935"/>
  <line class="life" x1="245" y1="184" x2="245" y2="935"/>
  <line class="life" x1="455" y1="184" x2="455" y2="935"/>
  <line class="life" x1="663" y1="184" x2="663" y2="935"/>
  <line class="life" x1="865" y1="184" x2="865" y2="935"/>
  <line class="life" x1="1067" y1="184" x2="1067" y2="935"/>
  <line class="life" x1="1245" y1="184" x2="1245" y2="935"/>
  <line class="life" x1="1440" y1="184" x2="1440" y2="935"/>

  <rect class="activate-web" x="238" y="220" width="14" height="650"/>
  <rect class="activate-decorator" x="448" y="270" width="14" height="555"/>
  <rect class="activate-cache" x="656" y="315" width="14" height="105"/>
  <rect class="activate-cache" x="656" y="805" width="14" height="38"/>
  <rect class="activate-service" x="858" y="500" width="14" height="260"/>
  <rect class="activate-provider" x="1060" y="540" width="14" height="52"/>
  <rect class="activate-provider" x="1238" y="620" width="14" height="52"/>
  <rect class="activate-provider" x="1433" y="700" width="14" height="52"/>

  <rect class="hit" x="530" y="228" width="330" height="54"/>
  <text class="small" x="695" y="251" text-anchor="middle">If Redis has the key, the decorator returns</text>
  <text class="small" x="695" y="271" text-anchor="middle">without executing JobSearchService.</text>

  <rect class="miss" x="520" y="430" width="420" height="54"/>
  <text class="small" x="730" y="454" text-anchor="middle">On cache miss, the decorator delegates to the real service.</text>
  <text class="small" x="730" y="474" text-anchor="middle">The result is cached only when it is not empty.</text>

  <path class="call" d="M80 230 L238 230"/>
  <text class="small" x="95" y="220">1. POST /jobs/search</text>

  <path class="call" d="M252 285 L448 285"/>
  <text class="small" x="292" y="274">2. search(criteria)</text>

  <path class="cache-call" d="M462 330 L656 330"/>
  <text class="small" x="500" y="319">3. read cache key</text>

  <path class="cache-return" d="M656 390 L462 390"/>
  <text class="small" x="505" y="381">4a. cached List&lt;Job&gt;</text>
  <path class="return" d="M448 420 L252 420"/>
  <text class="small" x="310" y="411">5a. return cached result</text>
  <path class="return" d="M238 445 L80 445"/>
  <text class="small" x="110" y="436">6a. 200 OK</text>

  <path class="call" d="M462 515 L858 515"/>
  <text class="small" x="570" y="504">4b. delegate search(criteria)</text>

  <path class="call" d="M872 555 L1060 555"/>
  <text class="small" x="905" y="544">5. search Jobicy</text>
  <path class="return" d="M1060 590 L872 590"/>
  <text class="small" x="920" y="582">6. List&lt;Job&gt;</text>

  <path class="call" d="M872 635 L1238 635"/>
  <text class="small" x="955" y="624">7. search LinkedIn</text>
  <path class="return" d="M1238 670 L872 670"/>
  <text class="small" x="1000" y="662">8. List&lt;Job&gt;</text>

  <path class="call" d="M872 715 L1433 715"/>
  <text class="small" x="985" y="704">9. search internal jobs</text>
  <path class="return" d="M1433 750 L872 750"/>
  <text class="small" x="1045" y="742">10. List&lt;Job&gt;</text>

  <path class="return" d="M858 785 L462 785"/>
  <text class="small" x="610" y="777">11. merged List&lt;Job&gt;</text>

  <path class="cache-call" d="M462 815 C520 870 610 870 656 815"/>
  <text class="small" x="560" y="890">12. write cache with TTL</text>

  <path class="return" d="M448 850 L252 850"/>
  <text class="small" x="310" y="842">13. List&lt;Job&gt;</text>
  <path class="return" d="M238 895 L80 895"/>
  <text class="small" x="112" y="887">14. 200 OK + jobs</text>

  <rect class="legend" x="565" y="950" width="470" height="58"/>
  <path class="call" d="M600 970 L665 970"/>
  <text class="tiny" x="690" y="975">application call</text>
  <path class="cache-call" d="M825 970 L890 970"/>
  <text class="tiny" x="915" y="975">cache access</text>
</svg>
