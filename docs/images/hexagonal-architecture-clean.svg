<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clean Hexagonal Architecture - Job Search App</title>
  <desc id="desc">Simple ports and adapters diagram for the job search application.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 800 32px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
    .hex { fill: #ffffff; stroke: #2563eb; stroke-width: 4; filter: url(#shadow); }
    .core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
    .domain { fill: #ecfdf5; stroke: #16a34a; stroke-width: 3; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; filter: url(#shadow); }
    .adapter { fill: #fff7ed; stroke: #f97316; }
    .port { fill: #dbeafe; stroke: #2563eb; }
    .external { fill: #f1f5f9; stroke: #64748b; }
    .label { font: 800 15px Arial, sans-serif; fill: #0f172a; }
    .small { font: 400 13px Arial, sans-serif; fill: #475569; }
    .arrow { stroke: #111827; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
    .soft { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="58" text-anchor="middle">Hexagonal Architecture</text>
  <text class="subtitle" x="600" y="86" text-anchor="middle">Adapters outside. Ports at the boundary. Domain in the center.</text>

  <polygon class="hex" points="345,125 855,125 1020,380 855,635 345,635 180,380"/>
  <polygon class="core" points="430,220 770,220 875,380 770,540 430,540 325,380"/>
  <polygon class="domain" points="500,320 700,320 750,380 700,440 500,440 450,380"/>

  <text class="label" x="600" y="260" text-anchor="middle">Application Core</text>
  <text class="label" x="600" y="382" text-anchor="middle">Domain</text>
  <text class="small" x="600" y="405" text-anchor="middle">Job + JobSearchCriteria</text>

  <rect class="card adapter" x="70" y="330" width="210" height="86"/>
  <text class="label" x="175" y="362" text-anchor="middle">Web Adapter</text>
  <text class="small" x="175" y="386" text-anchor="middle">JobSearchController</text>

  <rect class="card port" x="340" y="330" width="190" height="86"/>
  <text class="label" x="435" y="362" text-anchor="middle">Input Port</text>
  <text class="small" x="435" y="386" text-anchor="middle">SearchJobsUseCase</text>

  <rect class="card port" x="670" y="330" width="190" height="86"/>
  <text class="label" x="765" y="362" text-anchor="middle">Output Port</text>
  <text class="small" x="765" y="386" text-anchor="middle">JobProvider</text>

  <rect class="card adapter" x="920" y="250" width="220" height="74"/>
  <text class="label" x="1030" y="278" text-anchor="middle">Jobicy Adapter</text>
  <text class="small" x="1030" y="300" text-anchor="middle">JSON API</text>

  <rect class="card adapter" x="920" y="344" width="220" height="74"/>
  <text class="label" x="1030" y="372" text-anchor="middle">LinkedIn Adapter</text>
  <text class="small" x="1030" y="394" text-anchor="middle">HTML parser</text>

  <rect class="card adapter" x="920" y="438" width="220" height="74"/>
  <text class="label" x="1030" y="466" text-anchor="middle">Internal Adapter</text>
  <text class="small" x="1030" y="488" text-anchor="middle">future source</text>

  <rect class="card external" x="480" y="585" width="240" height="64"/>
  <text class="label" x="600" y="611" text-anchor="middle">AppConfig</text>
  <text class="small" x="600" y="633" text-anchor="middle">wires providers</text>

  <path class="arrow" d="M280 373 L340 373"/>
  <path class="arrow" d="M530 373 L670 373"/>
  <path class="arrow" d="M860 373 L920 287"/>
  <path class="arrow" d="M860 373 L920 381"/>
  <path class="arrow" d="M860 373 L920 475"/>
  <path class="soft" d="M600 585 C610 535 650 490 765 416"/>
  <path class="soft" d="M600 585 C500 520 440 470 435 416"/>
</svg>
