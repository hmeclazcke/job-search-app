<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Provider Loop Execution Flow - Job Search App</title>
  <desc id="desc">Execution flow diagram focused on the provider loop inside JobSearchService.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 800 30px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
    .card { fill: #ffffff; stroke-width: 2; rx: 10; filter: url(#shadow); }
    .web { stroke: #2563eb; fill: #eff6ff; }
    .service { stroke: #d97706; fill: #fffbeb; }
    .provider { stroke: #7c3aed; fill: #f5f3ff; }
    .domain { stroke: #16a34a; fill: #ecfdf5; }
    .external { stroke: #64748b; fill: #f1f5f9; }
    .label { font: 800 15px Arial, sans-serif; fill: #111827; }
    .small { font: 400 13px Arial, sans-serif; fill: #475569; }
    .code { font: 400 13px Consolas, monospace; fill: #334155; }
    .arrow { stroke: #111827; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .return { stroke: #64748b; stroke-width: 2.1; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="56" text-anchor="middle">Execution Flow - Provider Loop</text>
  <text class="subtitle" x="600" y="84" text-anchor="middle">The service treats every job source through the same port.</text>

  <rect class="card web" x="70" y="140" width="210" height="78"/>
  <text class="label" x="175" y="170" text-anchor="middle">HTTP Request</text>
  <text class="small" x="175" y="194" text-anchor="middle">POST /jobs/search</text>

  <rect class="card web" x="360" y="140" width="210" height="78"/>
  <text class="label" x="465" y="170" text-anchor="middle">Controller</text>
  <text class="small" x="465" y="194" text-anchor="middle">maps request to criteria</text>

  <rect class="card service" x="650" y="140" width="240" height="78"/>
  <text class="label" x="770" y="170" text-anchor="middle">JobSearchService</text>
  <text class="code" x="770" y="194" text-anchor="middle">List&lt;JobProvider&gt;</text>

  <rect class="card domain" x="940" y="140" width="190" height="78"/>
  <text class="label" x="1035" y="170" text-anchor="middle">Response</text>
  <text class="small" x="1035" y="194" text-anchor="middle">List&lt;Job&gt;</text>

  <path class="arrow" d="M280 179 L360 179"/>
  <path class="arrow" d="M570 179 L650 179"/>
  <path class="return" d="M890 179 L940 179"/>

  <rect class="card provider" x="125" y="330" width="240" height="100"/>
  <text class="label" x="245" y="360" text-anchor="middle">Jobicy Provider</text>
  <text class="small" x="245" y="384" text-anchor="middle">client + mapper</text>
  <text class="small" x="245" y="406" text-anchor="middle">JSON -> Job</text>

  <rect class="card provider" x="480" y="330" width="240" height="100"/>
  <text class="label" x="600" y="360" text-anchor="middle">LinkedIn Provider</text>
  <text class="small" x="600" y="384" text-anchor="middle">parser + mapper</text>
  <text class="small" x="600" y="406" text-anchor="middle">HTML -> Job</text>

  <rect class="card provider" x="835" y="330" width="240" height="100"/>
  <text class="label" x="955" y="360" text-anchor="middle">Internal Provider</text>
  <text class="small" x="955" y="384" text-anchor="middle">placeholder</text>
  <text class="small" x="955" y="406" text-anchor="middle">empty list</text>

  <rect class="card external" x="125" y="540" width="240" height="72"/>
  <text class="label" x="245" y="570" text-anchor="middle">Jobicy API</text>
  <text class="small" x="245" y="592" text-anchor="middle">remote jobs</text>

  <rect class="card external" x="480" y="540" width="240" height="72"/>
  <text class="label" x="600" y="570" text-anchor="middle">LinkedIn HTML</text>
  <text class="small" x="600" y="592" text-anchor="middle">job cards</text>

  <rect class="card external" x="835" y="540" width="240" height="72"/>
  <text class="label" x="955" y="570" text-anchor="middle">Internal Source</text>
  <text class="small" x="955" y="592" text-anchor="middle">future API / DB</text>

  <path class="arrow" d="M770 218 C650 275 430 280 245 330"/>
  <path class="arrow" d="M770 218 C690 275 640 295 600 330"/>
  <path class="arrow" d="M770 218 C830 275 900 295 955 330"/>

  <path class="arrow" d="M245 430 L245 540"/>
  <path class="arrow" d="M600 430 L600 540"/>
  <path class="arrow" d="M955 430 L955 540"/>

  <path class="return" d="M365 380 C455 500 630 545 770 218"/>
  <path class="return" d="M720 380 C760 445 820 430 770 218"/>
  <path class="return" d="M835 380 C795 445 760 430 770 218"/>

  <rect class="card domain" x="405" y="650" width="390" height="60"/>
  <text class="label" x="600" y="676" text-anchor="middle">Merge in service</text>
  <text class="small" x="600" y="696" text-anchor="middle">flatMap(provider.search(criteria)) -> List&lt;Job&gt;</text>
</svg>
