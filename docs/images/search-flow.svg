<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Search request flow</title>
  <desc id="desc">Sequence-style diagram describing how a job search request flows through controller, use case, providers, clients, mappers, and response.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font: 700 32px Arial, sans-serif; }
    .subtitle { fill: #475569; font: 400 16px Arial, sans-serif; }
    .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .actor { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 8; }
    .app { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
    .adapter { fill: #ffedd5; stroke: #f97316; stroke-width: 2; rx: 8; }
    .domain { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
    .label { fill: #0f172a; font: 700 14px Arial, sans-serif; }
    .small { fill: #475569; font: 400 12px Arial, sans-serif; }
    .step { fill: #0f172a; font: 700 16px Arial, sans-serif; }
    .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .return { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="60" y="58">Search Request Flow</text>
  <text class="subtitle" x="60" y="88">Request in. Providers queried. Unified jobs out.</text>

  <rect class="lane" x="40" y="125" width="1120" height="515"/>

  <rect class="actor" x="70" y="175" width="155" height="74"/>
  <text class="label" x="96" y="207">HTTP Client</text>
  <text class="small" x="96" y="230">POST /jobs/search</text>

  <rect class="adapter" x="280" y="175" width="170" height="74"/>
  <text class="label" x="306" y="207">Controller</text>
  <text class="small" x="306" y="230">Map request</text>

  <rect class="app" x="505" y="175" width="170" height="74"/>
  <text class="label" x="531" y="207">Use Case</text>
  <text class="small" x="531" y="230">SearchJobsUseCase</text>

  <rect class="app" x="730" y="175" width="170" height="74"/>
  <text class="label" x="756" y="207">Service</text>
  <text class="small" x="756" y="230">JobSearchService</text>

  <rect class="app" x="955" y="175" width="170" height="74"/>
  <text class="label" x="981" y="207">Providers</text>
  <text class="small" x="981" y="230">JobProvider list</text>

  <path class="arrow" d="M225 212 L280 212"/>
  <path class="arrow" d="M450 212 L505 212"/>
  <path class="arrow" d="M675 212 L730 212"/>
  <path class="arrow" d="M900 212 L955 212"/>

  <text class="step" x="90" y="320">1. Providers adapt external sources</text>

  <rect class="adapter" x="110" y="360" width="250" height="90"/>
  <text class="label" x="140" y="392">Jobicy provider</text>
  <text class="small" x="140" y="417">HttpJobicyApiClient</text>
  <text class="small" x="140" y="438">JobicyJobMapper</text>

  <rect class="adapter" x="475" y="360" width="250" height="90"/>
  <text class="label" x="505" y="392">LinkedIn provider</text>
  <text class="small" x="505" y="417">HttpLinkedInApiClient</text>
  <text class="small" x="505" y="438">Parser + Mapper</text>

  <rect class="adapter" x="840" y="360" width="250" height="90"/>
  <text class="label" x="870" y="392">Internal provider</text>
  <text class="small" x="870" y="417">HttpInternalJobApiClient</text>
  <text class="small" x="870" y="438">InternalJobMapper</text>

  <path class="arrow" d="M1040 249 L235 360"/>
  <path class="arrow" d="M1040 249 L600 360"/>
  <path class="arrow" d="M1040 249 L965 360"/>

  <text class="step" x="90" y="520">2. All results become domain jobs</text>

  <rect class="domain" x="360" y="555" width="210" height="64"/>
  <text class="label" x="412" y="582">List&lt;Job&gt;</text>
  <text class="small" x="400" y="604">unified model</text>

  <rect class="adapter" x="660" y="555" width="210" height="64"/>
  <text class="label" x="701" y="582">Response DTO</text>
  <text class="small" x="697" y="604">JobSearchResponse</text>

  <path class="return" d="M235 450 L465 555"/>
  <path class="return" d="M600 450 L465 555"/>
  <path class="return" d="M965 450 L465 555"/>
  <path class="arrow" d="M570 587 L660 587"/>
  <path class="return" d="M660 587 L148 249"/>
</svg>
