<svg width="1500" height="1000" viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hexagonal Architecture - Job Search App</title>
  <desc id="desc">Hexagonal architecture diagram showing HTTP input, the cached search decorator, the real job search service, provider output ports, MongoDB, external APIs, and Redis as an external cache store.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#111827"/>
    </marker>
    <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#6d28d9"/>
    </marker>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M12,7 L2,2 L2,12 Z" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    </marker>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#111827" flood-opacity="0.15"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 800 34px Arial, sans-serif; fill: #111827; }
    .subtitle { font: italic 20px Arial, sans-serif; fill: #374151; }
    .section { font: 800 23px Arial, sans-serif; }
    .label { font: 800 16px Arial, sans-serif; fill: #111827; }
    .small { font: 400 14px Arial, sans-serif; fill: #111827; }
    .tiny { font: 400 12px Arial, sans-serif; fill: #374151; }
    .card { fill: #ffffff; stroke-width: 2.2; rx: 10; filter: url(#card-shadow); }
    .web { fill: #eef6ff; stroke: #2563eb; }
    .app { fill: #eff6ff; stroke: #2563eb; }
    .decorator { fill: #fef3c7; stroke: #d97706; }
    .adapter { fill: #f0fdf4; stroke: #15803d; }
    .cache { fill: #ccfbf1; stroke: #0f766e; }
    .domain-card { fill: #fff7ed; stroke: #b45309; }
    .external { fill: #f9fafb; stroke: #111827; }
    .outer { fill: #faf5ff; fill-opacity: 0.42; stroke: #6d28d9; stroke-width: 3; }
    .middle { fill: #f0fdf4; fill-opacity: 0.55; stroke: #15803d; stroke-width: 3; }
    .inner { fill: #eff6ff; fill-opacity: 0.7; stroke: #2563eb; stroke-width: 3; }
    .domain-hex { fill: #fffbeb; fill-opacity: 0.9; stroke: #b45309; stroke-width: 3; }
    .runtime { stroke: #111827; stroke-width: 2.8; fill: none; marker-end: url(#arrow-black); }
    .cache-line { stroke: #0f766e; stroke-width: 2.6; fill: none; marker-end: url(#arrow-teal); }
    .implements { stroke: #111827; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#triangle); }
    .wires { stroke: #6d28d9; stroke-width: 2.4; fill: none; stroke-dasharray: 3 7; marker-end: url(#arrow-purple); }
    .legend-box { fill: #ffffff; stroke: #111827; stroke-width: 1.8; rx: 10; }
  </style>

  <rect class="bg" width="1500" height="1000"/>
  <text class="title" x="750" y="48" text-anchor="middle">Hexagonal Architecture - Job Search App</text>
  <text class="subtitle" x="750" y="78" text-anchor="middle">Ports, adapters, and a Redis-backed decorator for repeated searches</text>

  <polygon class="outer" points="385,100 1115,100 1288,470 1115,840 385,840 212,470"/>
  <polygon class="middle" points="360,245 1135,245 1245,455 1135,790 360,790 255,455"/>
  <polygon class="inner" points="500,290 915,290 1010,505 915,735 500,735 405,505"/>
  <polygon class="domain-hex" points="540,715 820,715 860,775 820,835 540,835 500,775"/>

  <text class="section" x="750" y="128" text-anchor="middle" fill="#6d28d9">1. Configuration</text>
  <text class="section" x="750" y="274" text-anchor="middle" fill="#15803d">2. Adapters</text>
  <text class="section" x="750" y="322" text-anchor="middle" fill="#1d4ed8">3. Application</text>
  <text class="section" x="680" y="750" text-anchor="middle" fill="#92400e">4. Domain</text>

  <rect class="card web" x="485" y="145" width="230" height="74"/>
  <text class="label" x="600" y="173" text-anchor="middle">AppConfig</text>
  <text class="small" x="600" y="196" text-anchor="middle">creates JobProvider beans</text>

  <rect class="card cache" x="780" y="145" width="230" height="74"/>
  <text class="label" x="895" y="173" text-anchor="middle">CacheConfig</text>
  <text class="small" x="895" y="196" text-anchor="middle">enables Spring Cache</text>

  <text class="label" x="340" y="315" text-anchor="middle" fill="#14532d">Driving Adapter</text>
  <text class="small" x="340" y="337" text-anchor="middle" fill="#14532d">HTTP input</text>
  <rect class="card adapter" x="230" y="430" width="230" height="78"/>
  <text class="label" x="345" y="458" text-anchor="middle">JobSearchController</text>
  <text class="small" x="345" y="482" text-anchor="middle">REST controller</text>

  <rect class="card app" x="520" y="350" width="260" height="70"/>
  <text class="label" x="650" y="378" text-anchor="middle">SearchJobsUseCase</text>
  <text class="small" x="650" y="400" text-anchor="middle">input port</text>

  <rect class="card decorator" x="520" y="465" width="260" height="76"/>
  <text class="label" x="650" y="493" text-anchor="middle">CachedJobSearchService</text>
  <text class="small" x="650" y="516" text-anchor="middle">primary decorator</text>

  <rect class="card app" x="520" y="585" width="260" height="76"/>
  <text class="label" x="650" y="613" text-anchor="middle">JobSearchService</text>
  <text class="small" x="650" y="636" text-anchor="middle">provider coordinator</text>

  <rect class="card app" x="805" y="585" width="190" height="76"/>
  <text class="label" x="900" y="613" text-anchor="middle">JobProvider</text>
  <text class="small" x="900" y="636" text-anchor="middle">output port</text>

  <rect class="card cache" x="45" y="640" width="180" height="72"/>
  <text class="label" x="135" y="668" text-anchor="middle">Redis</text>
  <text class="small" x="135" y="690" text-anchor="middle">external cache store</text>

  <text class="label" x="1120" y="315" text-anchor="middle" fill="#14532d">Driven Adapters</text>
  <text class="small" x="1120" y="337" text-anchor="middle" fill="#14532d">job sources</text>
  <rect class="card adapter" x="1065" y="385" width="210" height="64"/>
  <text class="label" x="1170" y="411" text-anchor="middle">Jobicy Provider</text>
  <text class="small" x="1170" y="431" text-anchor="middle">client + mapper</text>
  <rect class="card adapter" x="1065" y="485" width="210" height="64"/>
  <text class="label" x="1170" y="511" text-anchor="middle">LinkedIn Provider</text>
  <text class="small" x="1170" y="531" text-anchor="middle">parser + mapper</text>
  <rect class="card adapter" x="1065" y="585" width="210" height="64"/>
  <text class="label" x="1170" y="611" text-anchor="middle">Internal Provider</text>
  <text class="small" x="1170" y="631" text-anchor="middle">Mongo client + mapper</text>

  <rect class="card external" x="1320" y="389" width="140" height="56"/>
  <text class="small" x="1390" y="422" text-anchor="middle">Jobicy API</text>
  <rect class="card external" x="1320" y="489" width="140" height="56"/>
  <text class="small" x="1390" y="522" text-anchor="middle">LinkedIn HTML</text>
  <rect class="card external" x="1320" y="589" width="140" height="56"/>
  <text class="small" x="1390" y="622" text-anchor="middle">MongoDB Job</text>

  <rect class="card domain-card" x="555" y="765" width="110" height="44"/>
  <text class="label" x="610" y="793" text-anchor="middle">Job</text>
  <rect class="card domain-card" x="695" y="765" width="170" height="44"/>
  <text class="label" x="780" y="793" text-anchor="middle">Criteria</text>
  <text class="tiny" x="680" y="825" text-anchor="middle" font-style="italic">framework-free model</text>

  <circle cx="95" cy="430" r="22" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <path d="M55 520 C60 472 130 472 135 520 Z" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text class="label" x="95" y="555" text-anchor="middle">User</text>

  <path class="runtime" d="M140 468 L230 468"/>
  <path class="runtime" d="M460 468 C495 438 515 410 520 385"/>
  <path class="runtime" d="M650 420 L650 465"/>
  <path class="runtime" d="M650 541 L650 585"/>
  <path class="runtime" d="M780 623 L805 623"/>
  <path class="runtime" d="M995 623 L1065 623"/>
  <path class="runtime" d="M1275 417 L1320 417"/>
  <path class="runtime" d="M1275 517 L1320 517"/>
  <path class="runtime" d="M1275 617 L1320 617"/>

  <path class="cache-line" d="M520 503 C420 545 305 620 225 675"/>
  <path class="cache-line" d="M225 675 C350 650 485 595 650 541"/>

  <path class="implements" d="M1065 517 C1030 550 1010 590 995 623"/>

  <path class="wires" d="M895 219 C940 325 875 455 780 503"/>

  <rect class="legend-box" x="445" y="865" width="610" height="95"/>
  <text class="label" x="475" y="895">Legend</text>
  <path class="runtime" d="M565 892 L640 892"/>
  <text class="small" x="670" y="897">runtime call</text>
  <path class="implements" d="M565 920 L640 920"/>
  <text class="small" x="670" y="925">implements port</text>
  <path class="wires" d="M820 920 L895 920"/>
  <text class="small" x="925" y="925">Spring wiring</text>
  <path class="cache-line" d="M820 892 L895 892"/>
  <text class="small" x="925" y="897">cache access</text>
</svg>
